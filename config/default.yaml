app:
  poll_interval_ms: 1000
  logging_enabled: false

privacy:
  collect_window_titles: true
  collect_process_names: true
  log_activity: false

context:
  dwell_seconds_min: 3
  dwell_seconds_max: 8
  default_dwell_seconds: 5

transition:
  deep_focus_crossfade_seconds: 12.0
  distraction_recovery_seconds: 4.5
  cooldown_seconds: 60.0
  hysteresis_threshold: 0.08

cognitive:
  sensitivity: 1.0
  focus_smoothing: 0.85

audio:
  backend: placeholder
  sample_rate: 44100
  block_size: 1024
  master_volume: 0.75
  prefer_mp3: true
  assets_dir: assets/audio
  godot_project: godot
  godot_executable: ""          # see README: place Godot exe in project root, then set path here
  godot_host: 127.0.0.1
  godot_port: 8765
  godot_startup_timeout: 8.0
  fallback_to_placeholder: true

adaptive_music:
  enabled: true
  intensity_smoothing: 0.70
  enter_focus: 0.40
  enter_deep_focus: 0.70
  leave_deep_focus: 0.60
  leave_focus: 0.30
  min_state_seconds: 3.0
  recovery_seconds: 10.0
  default_crossfade_ms: 1500
  master_volume: 0.75
  gain_slew_seconds: 1.25
  energy_limit: 2.4
  recovery_peak: 0.55
  # Optional overrides: layer_id → [[score, gain], ...]
  layer_mix: {}

generative_layers:
  enabled: true
  api_base_url: "http://127.0.0.1:7862"
  model_size: small
  timeout_seconds: 180
  output_layers:
    - texture
    - melody_b

stem_separation:
  enabled: true
  api_base_url: "http://127.0.0.1:7863"
  model: htdemucs
  timeout_seconds: 600
  auto_on_upload: true
