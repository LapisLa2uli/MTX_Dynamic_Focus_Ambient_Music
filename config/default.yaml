app:
  poll_interval_ms: 1000
  logging_enabled: false

privacy:
  collect_window_titles: true
  collect_process_names: true
  log_activity: false

context:
  dwell_seconds_min: 3
  dwell_seconds_max: 8
  default_dwell_seconds: 5

transition:
  deep_focus_crossfade_seconds: 12.0
  distraction_recovery_seconds: 4.5
  cooldown_seconds: 60.0
  hysteresis_threshold: 0.08

cognitive:
  sensitivity: 1.0
  focus_smoothing: 0.40
  uncalibrated_focus_smoothing: 0.18
  auto_distraction_enabled: true
  auto_distraction_enter: 0.38
  auto_distraction_exit: 0.50
  auto_distraction_dwell_seconds: 4.0

focus_index:
  enabled: true
  window_seconds: 180
  weight_alignment: 0.40
  weight_switch: 0.30
  weight_idle: 0.20
  weight_probe: 0.10
  probe_ttl_minutes: 45
  retention_days: 7
  aligned_switch_penalty: 0.2
  recency_tau_seconds: 45
  pattern_gate_low: 55
  pattern_assist_max: 8
  switch_rate_ref: 1.25
  short_burst_s: 45
  idle_threshold_s: 45
  db_path: config/focus_index.sqlite

muffling:
  strength: 0.65
  break_muffling: 0.85
  curve_multiplier: 3.0

pomodoro:
  work_minutes: 25
  break_minutes: 5
  session_calibration_minutes: 5

audio:
  backend: placeholder
  sample_rate: 44100
  block_size: 1024
  master_volume: 0.75
  prefer_mp3: true
  assets_dir: assets/audio
  godot_project: godot
  godot_executable: ""          # see README: place Godot exe in project root, then set path here
  godot_host: 127.0.0.1
  godot_port: 8765
  godot_startup_timeout: 8.0
  fallback_to_placeholder: true

adaptive_music:
  enabled: true
  intensity_smoothing: 0.35
  enter_focus: 0.40
  enter_deep_focus: 0.70
  leave_deep_focus: 0.60
  leave_focus: 0.30
  min_state_seconds: 3.0
  recovery_seconds: 8.0
  default_crossfade_ms: 1500
  master_volume: 0.75
  gain_slew_seconds: 1.0
  energy_limit: 2.4
  recovery_peak: 0.55
  # Optional overrides: layer_id → [[score, gain], ...]
  layer_mix: {}
  # Phrase-boundary detection: p = 1/(1+exp(-(-1.058 - 0.425*z_vol + 0.290*z_pitch)))
  phrase_boundary_enabled: true
  phrase_boundary_threshold: 0.40
  phrase_search_seconds: 10.0
  phrase_fadeout_seconds: 3.0
  phrase_gap_seconds: 0.5
  fallback_crossfade_seconds: 3.0

generative_layers:
  enabled: true
  api_base_url: "http://127.0.0.1:7862"
  model_size: small
  timeout_seconds: 600
  conda_env: musicgen
  auto_start_api: true
  auto_on_upload: true
  output_layers:
    - texture
    - melody_b

stem_separation:
  enabled: true
  api_base_url: "http://127.0.0.1:7863"
  model: htdemucs_ft
  timeout_seconds: 600
  auto_on_upload: true
  # Prefer a dedicated "demucs" env; app falls back to "musicgen" if missing.
  conda_env: musicgen
  auto_start_api: true

sidecar_apis:
  startup_timeout_seconds: 300
  stop_when_done: false
